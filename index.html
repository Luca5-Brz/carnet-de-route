<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e12"><title>Carnet de route — Prototype</title><style>
:root{color-scheme:dark;--bg:#0b0e12;--card:#171c23;--card2:#202630;--line:#2b323d;--text:#f1f5fb;--muted:#9ca7b6;--blue:#247dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(94px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 18px}h1{font-size:27px;letter-spacing:-.8px;margin:0}h2{font-size:18px;margin:24px 0 12px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:active{transform:scale(.99)}.iconbtn{background:none;border:0;color:var(--muted);font-size:23px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat,.card{background:linear-gradient(145deg,#1a2028,#151a21);border:1px solid #252c36;border-radius:14px}.stat{padding:18px 15px}.stat strong{display:block;font-size:25px}.muted{color:var(--muted);font-size:13px}.primary{width:100%;background:var(--blue);border:0;color:white;border-radius:12px;padding:16px;font-weight:700;margin:17px 0}.menu{margin-top:3px;overflow:hidden}.menu button,.listrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;color:var(--text);border:0;padding:17px 15px;text-align:left;border-bottom:1px solid var(--line)}.menu button:last-child,.listrow:last-child{border:0}.menu .sym{color:var(--blue);font-size:19px;margin-right:10px}.trip{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.trip:last-child{border:0}.trip strong{font-size:15px}.trip small{display:block;color:var(--muted);margin-top:5px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:0;border-radius:9px;background:var(--card2);color:var(--muted);padding:10px 13px}.tabs button.active{background:var(--blue);color:white}.group{margin:14px 0}.grouphead{padding:13px 15px;font-weight:700;display:flex;justify-content:space-between}.grouphead span{color:var(--muted)}.field{margin:17px 0}.field label{display:block;margin-bottom:9px;font-weight:600;font-size:14px}input,select,textarea{display:block;width:100%;background:var(--card);color:var(--text);border:1px solid #343d49;border-radius:10px;padding:14px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue)}.distance{background:#102642;border-radius:12px;padding:16px;margin-top:15px;color:#72b3ff}.distance strong{display:block;color:#e6f1ff;font-size:25px;margin-top:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.tiny{font-size:12px;color:var(--muted)}.empty{padding:30px 18px;text-align:center;color:var(--muted)}.bottom{position:fixed;bottom:0;left:0;right:0;background:#10151bf2;border-top:1px solid var(--line);padding:9px max(12px,calc((100vw - 560px)/2)) calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(15px)}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:4px;justify-items:center;min-width:60px}.bottom button b{font-size:21px;font-weight:400}.bottom button.active{color:#4592ff}.notice{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}.color-dot{width:12px;height:12px;display:inline-block;border-radius:50%;margin-right:9px}.danger{color:#ff6969;background:none;border:0;padding:12px}.link{background:none;border:0;color:#4592ff;padding:5px}.bar{height:9px;background:#2a3038;border-radius:8px;overflow:hidden;margin:9px 0 17px}.bar div{height:100%;background:#2681ff;border-radius:8px}#view{animation:fade .15s ease}@keyframes fade{from{opacity:.6}to{opacity:1}}</style></head><body><main class="app"><div id="view"></div></main><nav class="bottom" id="nav"></nav><script>
const key='carnet-route-demo-v1';const defaults={vehicles:[{id:'v1',name:'VW Transporter',plate:'1-ABC-123',color:'#2583ff'},{id:'v2',name:'Peugeot Partner',plate:'2-DEF-456',color:'#62c83c'},{id:'v3',name:'Volkswagen Golf',plate:'1-GHI-789',color:'#ff921c'}],events:[{id:'e1',name:'Festival XYZ'},{id:'e2',name:'Montage salle'},{id:'e3',name:'Démontage'}],trips:[{id:'t1',vehicle:'v1',event:'e1',date:'2026-10-12',start:12450,end:12568,note:'Transport matériel + installation'},{id:'t2',vehicle:'v2',event:'e2',date:'2026-10-10',start:9000,end:9064,note:''},{id:'t3',vehicle:'v3',event:'e3',date:'2026-10-08',start:4400,end:4442,note:''}]};let db=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(defaults),page='home',filter='vehicle',selectedTrip=null;const $=s=>document.querySelector(s),save=()=>localStorage.setItem(key,JSON.stringify(db)),vehicle=id=>db.vehicles.find(x=>x.id===id)||{name:'Véhicule supprimé',color:'#aaa'},event=id=>db.events.find(x=>x.id===id)||{name:'Événement supprimé'},km=n=>Number(n||0).toLocaleString('fr-BE')+' km',dist=t=>t.end-t.start,escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>new Date(s+'T12:00:00').toLocaleDateString('fr-BE',{day:'numeric',month:'short',year:'numeric'}),total=arr=>arr.reduce((s,t)=>s+dist(t),0);function go(p){page=p;render();scrollTo(0,0)}function nav(){let items=[['home','⌂','Accueil'],['history','◷','Historique'],['vehicles','▣','Véhicules'],['events','▦','Événements'],['stats','▥','Stats']];$('#nav').innerHTML=items.map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><b>${i}</b>${l}</button>`).join('')}function head(title,back=false,extra=''){return `<header>${back?`<button class="iconbtn" onclick="go('home')">‹</button>`:''}<h1>${title}</h1>${extra||'<span></span>'}</header>`}function tripRow(t){return `<div class="trip" style="border-left:3px solid ${vehicle(t.vehicle).color}" onclick="selectedTrip='${t.id}';go('detail')"><div><strong>${date(t.date)}</strong><small>${escape(event(t.event).name)} · ${escape(vehicle(t.vehicle).name)}</small></div><strong>${km(dist(t))} ›</strong></div>`}function home(){let now=new Date(),month=db.trips.filter(t=>{let d=new Date(t.date+'T12:00:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});return head('Carnet de route',false,'<span style="font-size:22px">⚙</span>')+`<div class="stats"><div class="stat"><strong>${km(total(month))}</strong><span class="muted">Ce mois-ci</span></div><div class="stat"><strong>${km(total(db.trips))}</strong><span class="muted">Total enregistré</span></div></div><button class="primary" onclick="go('newtrip')">＋ &nbsp; Nouveau trajet</button><div class="card menu"><button onclick="go('history')"><span><span class="sym">◷</span>Historique</span>›</button><button onclick="go('vehicles')"><span><span class="sym">▣</span>Véhicules</span>›</button><button onclick="go('events')"><span><span class="sym">▦</span>Événements</span>›</button></div><h2>Derniers trajets</h2><div class="card">${[...db.trips].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(tripRow).join('')||'<div class="empty">Aucun trajet</div>'}</div><p class="notice">Prototype de démonstration · données enregistrées sur cet appareil</p>`}function newtrip(){return head('Nouveau trajet',true)+`<form id="tripform"><div class="field"><label>Véhicule</label><select name="vehicle" required>${db.vehicles.map(v=>`<option value="${v.id}">${escape(v.name)}</option>`).join('')}</select></div><div class="field"><label>Événement</label><select name="event" required>${db.events.map(e=>`<option value="${e.id}">${escape(e.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label>Kilométrage de départ</label><input id="start" name="start" type="number" min="0" step="1" inputmode="numeric" required placeholder="Ex. 12450"></div><div class="field"><label>Kilométrage d'arrivée</label><input id="end" name="end" type="number" min="0" step="1" inputmode="numeric" required placeholder="Ex. 12568"></div><div class="distance">Distance calculée<strong id="distance">— km</strong></div><div class="field"><label>Notes (optionnel)</label><textarea name="note" rows="3" placeholder="Informations sur le trajet"></textarea></div><button class="primary">✓ &nbsp; Enregistrer le trajet</button></form>`}function history(){let sorted=[...db.trips].sort((a,b)=>b.date.localeCompare(a.date));let content=filter==='all'?`<div class="card">${sorted.map(tripRow).join('')}</div>`:filter==='vehicle'?db.vehicles.map(v=>group(v.name,sorted.filter(t=>t.vehicle===v.id),v.color)).join(''):db.events.map(e=>group(e.name,sorted.filter(t=>t.event===e.id),'#2583ff')).join('');return head('Historique',true)+`<div class="tabs">${[['all','Tous'],['vehicle','Par véhicule'],['event','Par événement']].map(([id,l])=>`<button class="${filter===id?'active':''}" onclick="filter='${id}';render()">${l}</button>`).join('')}</div>${content||'<div class="empty">Aucun trajet enregistré</div>'}`}function group(label,arr,color){if(!arr.length)return '';return `<div class="group card"><div class="grouphead"><div><span class="color-dot" style="background:${color}"></span>${escape(label)}</div><span>${km(total(arr))}</span></div>${arr.map(tripRow).join('')}</div>`}function vehicles(){return head('Véhicules',true,`<button class="iconbtn" onclick="go('addvehicle')">＋</button>`)+`<div class="card">${db.vehicles.map(v=>`<div class="listrow"><span><span class="color-dot" style="background:${v.color}"></span><b>${escape(v.name)}</b><small style="display:block;margin:5px 0 0 23px;color:var(--muted)">${escape(v.plate||'Sans immatriculation')}</small></span><span class="muted">${km(total(db.trips.filter(t=>t.vehicle===v.id)))}</span></div>`).join('')}</div>`}function addvehicle(){return head('Ajouter un véhicule',true)+`<form id="vehicleform"><div class="field"><label>Nom du véhicule</label><input name="name" required placeholder="Ex. VW Transporter"></div><div class="field"><label>Immatriculation (optionnel)</label><input name="plate" placeholder="Ex. 1-ABC-123"></div><div class="field"><label>Couleur</label><input name="color" type="color" value="#2583ff" style="height:55px"></div><button class="primary">Ajouter le véhicule</button></form>`}function events(){return head('Événements',true,`<button class="iconbtn" onclick="go('addevent')">＋</button>`)+`<div class="card">${db.events.map(e=>`<div class="listrow"><b>▦ &nbsp; ${escape(e.name)}</b><span class="muted">${km(total(db.trips.filter(t=>t.event===e.id)))}</span></div>`).join('')}</div>`}function addevent(){return head('Nouvel événement',true)+`<form id="eventform"><div class="field"><label>Nom de l'événement</label><input name="name" required placeholder="Ex. Festival XYZ"></div><button class="primary">Ajouter l'événement</button></form>`}function stats(){let max=Math.max(1,...db.vehicles.map(v=>total(db.trips.filter(t=>t.vehicle===v.id))));return head('Statistiques',true)+`<div class="card" style="padding:18px"><h2 style="margin-top:0">Distance par véhicule</h2>${db.vehicles.map(v=>{let n=total(db.trips.filter(t=>t.vehicle===v.id));return `<div class="row"><span>${escape(v.name)}</span><strong>${km(n)}</strong></div><div class="bar"><div style="width:${n/max*100}%;background:${v.color}"></div></div>`}).join('')}<div class="distance">Total de tous les trajets<strong>${km(total(db.trips))}</strong></div></div><h2>Par événement et véhicule</h2>${db.events.map(e=>{let trips=db.trips.filter(t=>t.event===e.id);return group(e.name,trips,'#2583ff')}).join('')}`}function detail(){let t=db.trips.find(t=>t.id===selectedTrip);if(!t)return history();return head('Détail du trajet',true)+`<div class="card" style="padding:18px"><h2 style="margin:0">${escape(vehicle(t.vehicle).name)}</h2><p class="muted">${escape(event(t.event).name)} · ${date(t.date)}</p><div class="distance">Distance parcourue<strong>${km(dist(t))}</strong></div></div><div class="card" style="padding:18px;margin-top:14px"><p>Départ : <b>${km(t.start)}</b></p><p>Arrivée : <b>${km(t.end)}</b></p><p>Notes : ${escape(t.note||'Aucune')}</p></div><button class="danger" onclick="if(confirm('Supprimer ce trajet ?')){db.trips=db.trips.filter(x=>x.id!==selectedTrip);save();go('history')}">🗑 Supprimer le trajet</button>`}function render(){let views={home,newtrip,history,vehicles,addvehicle,events,addevent,stats,detail};$('#view').innerHTML=views[page]();nav();if(page==='newtrip'){let f=$('#tripform');function calc(){let a=f.elements.start.value,b=f.elements.end.value;$('#distance').textContent=a!==''&&b!==''&&+b>=+a?km(+b-+a):'— km'}f.elements.start.oninput=calc;f.elements.end.oninput=calc;f.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));if(+x.end<+x.start){alert('Le compteur d’arrivée doit être supérieur ou égal au compteur de départ.');return}db.trips.push({id:'t'+Date.now(),vehicle:x.vehicle,event:x.event,date:x.date,start:+x.start,end:+x.end,note:x.note});save();go('home')}}if(page==='addvehicle')$('#vehicleform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.vehicles.push({id:'v'+Date.now(),...x});save();go('vehicles')};if(page==='addevent')$('#eventform').onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(e.target));db.events.push({id:'e'+Date.now(),...x});save();go('events')}}render();
</script></body></html>
